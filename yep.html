                                        <td class="p-3">Stretch Receptors / Brain</td>
                                        <td class="p-3">Oxytocin triggers stronger contractions</td>
                                        <td class="p-3">Baby is delivered</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                `
            },
            {
                chapterNum: 9,
                title: "Chapter 9: PISA Knowledge Challenge",
                subtitle: "15 Real-World Physiological Scenarios • Interactive Assessment",
                type: "PISA Assessment",
                badge: "Interactive Quiz",
                color: "cyan",
                html: `
                    <div class="space-y-6">
                        <!-- Quiz Header Info Box -->
                        <div class="bg-slate-950 border border-cyan-500/30 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-12 h-12 rounded-xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center text-2xl shrink-0 font-bold border border-cyan-500/30">
                                    <i class="fa-solid fa-clipboard-question"></i>
                                </div>
                                <div>
                                    <h3 class="font-display font-bold text-base text-cyan-300">PISA-Style Biological Reasoning Test</h3>
                                    <p class="text-xs text-slate-400">Answer all 15 scenario-based questions below to test your mastery of positive and negative feedback loops.</p>
                                </div>
                            </div>
                            <div id="quiz-score-badge" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-800 text-center shrink-0">
                                <span class="text-[10px] text-slate-400 block uppercase font-bold tracking-wider">Your Score</span>
                                <span id="quiz-score-text" class="text-lg font-mono font-bold text-slate-300">0 / 15</span>
                            </div>
                        </div>

                        <!-- Quiz Container where questions render -->
                        <div id="pisa-quiz-container" class="space-y-5">
                            <!-- Questions Injected by JS -->
                        </div>

                        <!-- Quiz Action Controls -->
                        <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-between gap-4">
                            <button onclick="resetPisaQuiz()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition flex items-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> Reset Answers
                            </button>
                            <button id="btn-submit-quiz" onclick="submitPisaQuiz()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold text-xs transition shadow-lg shadow-cyan-500/20 flex items-center gap-2">
                                <i class="fa-solid fa-check-double"></i> Submit & Check Score
                            </button>
                        </div>
                    </div>
                `
            }
        ];

        const pisaQuestions = [
            {
                id: 1,
                question: "While hiking in a cold mountain environment, a hiker's core body temperature drops to $35.0^\\circ\\text{C}$. In response, the brain sends nerve impulses to skeletal muscles, causing involuntary shivering. What role does shivering play in this feedback loop?",
                options: [
                    "A. Sensor detecting environmental temperature",
                    "B. Control center deciding the response",
                    "C. Effector producing metabolic body heat",
                    "D. Stimulus causing the initial change"
                ],
                correct: 2,
                explanation: "Skeletal muscles act as the effector. Rapid involuntary contractions generate metabolic heat, counteracting the cold stimulus to bring body temperature back up toward $37.0^\\circ\\text{C}$."
            },
            {
                id: 2,
                question: "A patient drinks a sugary beverage after fasting. Two hours later, their blood glucose levels remain abnormally elevated compared to a healthy individual. Based on glucose homeostasis mechanisms, which statement best explains this outcome?",
                options: [
                    "A. The kidneys secreted excessive glucagon",
                    "B. The pancreas produced insufficient insulin",
                    "C. The liver absorbed all available glucose",
                    "D. The body's metabolic rate increased rapidly"
                ],
                correct: 1,
                explanation: "When blood glucose rises after a meal, pancreatic beta cells should secrete insulin to promote cellular glucose uptake and glycogen storage in the liver. Abnormally high blood sugar indicates impaired insulin secretion or sensitivity."
            },
            {
                id: 3,
                question: "A marathon runner completes a race in hot weather without adequate fluid intake. Afterward, they notice their urine is sparse and dark yellow. How did the osmoregulation feedback loop bring about this change?",
                options: [
                    "A. The brain inhibited aldosterone secretion",
                    "B. Blood vessels dilated throughout the body",
                    "C. The kidneys excreted excess body salts",
                    "D. The pituitary gland released more ADH"
                ],
                correct: 3,
                explanation: "Dehydration increases blood osmolarity, which is detected by hypothalamic osmoreceptors. The pituitary releases ADH (antidiuretic hormone), prompting kidneys to reabsorb water and produce concentrated urine."
            },
            {
                id: 4,
                question: "An individual with hemophilia lacks functional blood clotting proteins. When injured, bleeding persists for an extended period. How does this condition impact the blood clotting feedback mechanism?",
                options: [
                    "A. It interrupts the platelet amplification cascade",
                    "B. It increases blood velocity through the wound",
                    "C. It converts the clotting process into negative feedback",
                    "D. It elevates pressure on damaged vessel walls"
                ],
                correct: 0,
                explanation: "Blood clotting relies on positive feedback: activated platelets release signaling chemicals that recruit even more platelets. Lacking clotting proteins breaks this amplification loop, preventing a stable fibrin plug from forming."
            },
            {
                id: 5,
                question: "During labor, pressure from the fetus on the cervix sends neural signals that stimulate oxytocin release, intensifying uterine contractions. If a laboring mother is administered an oxytocin receptor blocker, what will occur?",
                options: [
                    "A. Labor will accelerate due to relaxin release",
                    "B. Maternal blood pressure will spike rapidly",
                    "C. The progression of contractions will stop",
                    "D. Cervical stretch signals will increase automatically"
                ],
                correct: 2,
                explanation: "Oxytocin drives the positive feedback loop during labor. Blocking oxytocin receptors prevents the uterus from contracting in response to cervical stretch, halting the self-amplifying loop."
            },
            {
                id: 6,
                question: "Upon standing up quickly, a person experiences sudden lightheadedness as blood pressure in the brain momentarily drops. Within seconds, the dizziness subsides. Which physiological action directly restored their blood pressure to normal?",
                options: [
                    "A. Deceleration of the heart rate",
                    "B. Constriction of peripheral blood vessels",
                    "C. Reduction of blood adrenaline levels",
                    "D. Increased excretion of fluid by the kidneys"
                ],
                correct: 1,
                explanation: "Detected by baroreceptors, low blood pressure triggers a sympathetic response: heart rate increases and blood vessels constrict (vasoconstriction) to raise arterial pressure back to baseline."
            },
            {
                id: 7,
                question: "A student compares an air conditioner's thermostat (which turns off once cooled) to a firecracker (where initial ignition causes a rapidly accelerating explosion). Which feedback mechanisms do these two examples represent?",
                options: [
                    "A. Air conditioner: Positive loop; Firecracker: Negative loop",
                    "B. Air conditioner: Homeostasis; Firecracker: Thermoregulation",
                    "C. Air conditioner: Dynamic loop; Firecracker: Static loop",
                    "D. Air conditioner: Negative loop; Firecracker: Positive loop"
                ],
                correct: 3,
                explanation: "The AC is a negative feedback system because it reverses deviations from a setpoint. The firecracker represents a positive feedback system because the reaction accelerates itself until completion."
            },
            {
                id: 8,
                question: "When mountaineers ascend to high altitudes where oxygen levels are low, their body senses reduced blood oxygen. In response, the kidneys secrete the hormone erythropoietin (EPO) to stimulate red blood cell production. What type of feedback loop is this and what is its goal?",
                options: [
                    "A. Negative feedback; restoring oxygen-carrying capacity",
                    "B. Positive feedback; amplifying physical fatigue",
                    "C. Positive feedback; decreasing blood pressure",
                    "D. Negative feedback; slowing down respiratory rate"
                ],
                correct: 0,
                explanation: "This is a negative feedback loop because the response (producing more red blood cells) opposes the initial stimulus (low oxygen) to restore balance to tissue oxygenation."
            },
            {
                id: 9,
                question: "In severe heat stroke, extreme body temperature damages brain proteins and nerve cells. As a result, the hypothalamus loses its ability to initiate cooling, causing body temperature to rise even higher. What change occurred in the body's regulatory system?",
                options: [
                    "A. Sweat gland effectors accelerated dramatically",
                    "B. Negative feedback intensified to cool the body",
                    "C. A failed negative loop converted into a dangerous positive loop",
                    "D. The body established a higher healthy baseline setpoint"
                ],
                correct: 2,
                explanation: "When extreme heat damages the control center (hypothalamus), the negative feedback loop fails. Tissue damage generates more heat, turning the system into a life-threatening, self-reinforcing positive loop."
            },
            {
                id: 10,
                question: "After eating two bags of salty potato chips, Maria feels intensely thirsty and drinks two full glasses of water. How does triggering thirst contribute to homeostasis?",
                options: [
                    "A. It decreases water absorption in the intestine",
                    "B. It dilutes elevated blood sodium concentration",
                    "C. It resets resting blood pressure to zero",
                    "D. It accelerates glucose excretion by the kidneys"
                ],
                correct: 1,
                explanation: "High salt intake increases blood osmolarity. Ingesting water adds fluid to the bloodstream, diluting the elevated solute concentration and restoring normal blood osmolarity."
            },
            {
                id: 11,
                question: "When blood calcium levels fall below normal setpoints, the parathyroid glands release Parathyroid Hormone (PTH), causing bones to release calcium into the blood. Conversely, when blood calcium is too high, the thyroid releases calcitonin. This system is an example of:",
                options: [
                    "A. Antagonistic negative feedback control",
                    "B. Positive feedback amplification cascade",
                    "C. Unregulated physiological drift",
                    "D. Irreversible positive feedback loop"
                ],
                correct: 0,
                explanation: "Calcium regulation uses two opposing (antagonistic) hormones—PTH to raise calcium and calcitonin to lower it—working via negative feedback to keep blood calcium within tight limits."
            },
            {
                id: 12,
                question: "During a dry afternoon, a plant experiences water loss. In response, guard cells surrounding leaf stomata lose turgor pressure and close the pores, preventing further transpiration. What type of feedback does this plant response demonstrate?",
                options: [
                    "A. Positive feedback to maximize photosynthesis",
                    "B. Negative feedback to prevent lethal dehydration",
                    "C. Positive feedback to increase water uptake",
                    "D. Open loop response with no homeostatic goal"
                ],
                correct: 1,
                explanation: "Stomatal closure in response to water deficit is a negative feedback loop: the reduction in water triggers a response that limits further water loss, preserving moisture homeostasis."
            },
            {
                id: 13,
                question: "During intense exercise, muscular activity produces excess carbon dioxide ($\\text{CO}_2$), forming carbonic acid and lowering blood pH. Chemoreceptors detect this acidity and signal the brainstem to increase breathing rate. What is the primary outcome of this mechanism?",
                options: [
                    "A. Increasing blood acidity to stimulate muscles",
                    "B. Expelling excess $\\text{CO}_2$ to raise blood pH back to normal",
                    "C. Decreasing oxygen uptake in pulmonary capillaries",
                    "D. Storing carbon dioxide inside skeletal muscle tissue"
                ],
                correct: 1,
                explanation: "Increased ventilation expels carbon dioxide faster, shifting the acid-base equilibrium to lower hydrogen ion concentration and returning blood pH back to the normal setpoint ($\\sim 7.4$)."
            },
            {
                id: 14,
                question: "When a newborn infant suckles at the mother's breast, sensory nerve impulses travel to the hypothalamus, triggering the pituitary gland to release prolactin and oxytocin. These hormones cause milk ejection, encouraging the infant to suckle further. What type of loop is this?",
                options: [
                    "A. Negative feedback reducing milk production",
                    "B. Positive feedback amplifying milk ejection during feeding",
                    "C. Antagonistic hormonal inhibition loop",
                    "D. Static homeostatic baseline control"
                ],
                correct: 1,
                explanation: "Suckling stimulates hormone release that produces more milk ejection, which encourages continued suckling. This self-amplifying cascade is a positive feedback loop that continues until nursing ceases."
            },
            {
                id: 15,
                question: "In extreme sub-zero conditions, severe vasoconstriction in fingertips minimizes heat loss to shield vital core organs. If cold exposure persists, fingers may suffer tissue damage from hypoxia. What trade-off does this demonstrate in negative feedback thermoregulation?",
                options: [
                    "A. The body prioritizes core homeostasis over peripheral survival",
                    "B. Vasoconstriction turns into positive feedback heat production",
                    "C. The hypothalamus completely disables shivering effectors",
                    "D. Peripheral nerve cells permanently stop sending cold signals"
                ],
                correct: 0,
                explanation: "Negative feedback thermoregulation prioritizes maintaining core organ temperature ($37.0^\\circ\\text{C}$) to sustain life, sacrificing peripheral tissue blood flow when environmental cold stress is extreme."
            }
        ];

        let currentPageIndex = 0;
        let userAnswers = new Array(pisaQuestions.length).fill(null);
        let chapterCheckAnswers = {}; // Tracks quick check selections per chapter
        let isSubmitted = false;

        function renderPage() {
            const page = pagesData[currentPageIndex];
            const contentDiv = document.getElementById("page-content");

            // Build Header Info
            let badgeColorClass = page.color === "rose" ? "bg-rose-500/20 text-rose-300 border-rose-500/30" : "bg-cyan-500/20 text-cyan-300 border-cyan-500/30";
            
            // Build Quick Checks HTML if available for chapter
            let quickChecksHtml = "";
            if (page.quickChecks && page.quickChecks.length > 0) {
                quickChecksHtml = buildQuickChecksHtml(page);
            }

            contentDiv.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border ${badgeColorClass}">
                                ${page.badge}
                            </span>
                            <span class="text-xs text-slate-400 font-mono">Chapter ${page.chapterNum} of ${pagesData.length}</span>
                        </div>
                        <h2 class="font-display font-bold text-2xl text-slate-100">${page.title}</h2>
                        <p class="text-xs text-slate-400 mt-0.5">${page.subtitle}</p>
                    </div>
                </div>
                ${page.html}
                ${quickChecksHtml}
            `;

            // Update Header Progress Bar & Badge
            const progressPercent = ((currentPageIndex + 1) / pagesData.length) * 100;
            document.getElementById("reading-progress-bar").style.width = `${progressPercent}%`;
            document.getElementById("page-counter-badge").textContent = `Page ${currentPageIndex + 1} / ${pagesData.length}`;

            // Update Navigation Buttons
            document.getElementById("btn-prev").disabled = currentPageIndex === 0;
            
            const btnNext = document.getElementById("btn-next");
            if (currentPageIndex === pagesData.length - 1) {
                btnNext.innerHTML = `Finish Reader <i class="fa-solid fa-check ml-1"></i>`;
                btnNext.onclick = () => goToPage(0);
            } else {
                btnNext.innerHTML = `Next Chapter <i class="fa-solid fa-chevron-right ml-1"></i>`;
                btnNext.onclick = () => changePage(1);
            }

            // Render Page Dots
            const dotsContainer = document.getElementById("page-dots-container");
            dotsContainer.innerHTML = pagesData.map((_, idx) => `
                <button onclick="goToPage(${idx})" class="w-2.5 h-2.5 rounded-full transition-all ${idx === currentPageIndex ? 'bg-cyan-400 w-6' : 'bg-slate-700 hover:bg-slate-500'}"></button>
            `).join('');

            // Render Quiz if on Chapter 9
            if (page.chapterNum === 9) {
                renderQuiz();
            }

            // Re-render KaTeX Math Formulas
            initKaTeX();
            
            // Scroll to top of book container smoothly
            document.getElementById("book-page-wrapper").scrollTop = 0;
        }

        function buildQuickChecksHtml(page) {
            const chNum = page.chapterNum;
            const savedState = chapterCheckAnswers[chNum] || [null, null];

            return `
                <div class="mt-8 pt-6 border-t border-slate-800 space-y-4">
                    <div class="flex items-center gap-2 text-amber-400 font-display font-bold text-sm">
                        <div class="w-7 h-7 rounded-lg bg-amber-500/20 flex items-center justify-center border border-amber-500/30">
                            <i class="fa-solid fa-lightbulb text-xs"></i>
                        </div>
                        <span>Interactive Understanding Check (${page.quickChecks.length} Questions)</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${page.quickChecks.map((qc, qIdx) => {
                            const selected = savedState[qIdx];
                            const isCorrect = selected === qc.correct;

                            return `
                                <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-4 space-y-3 flex flex-col justify-between">
                                    <div class="space-y-2">
                                        <span class="text-[10px] font-bold font-mono text-cyan-400 uppercase tracking-wider block">Check ${qIdx + 1}</span>
                                        <h5 class="text-xs font-semibold text-slate-100 leading-snug">${qc.question}</h5>
                                    </div>

                                    <div class="space-y-2 pt-1">
                                        ${qc.options.map((opt, optIdx) => {
                                            let btnClass = "bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800";
                                            if (selected !== null) {
                                                if (optIdx === qc.correct) {
                                                    btnClass = "bg-emerald-950/90 border-emerald-500 text-emerald-200 font-bold";
                                                } else if (selected === optIdx) {
                                                    btnClass = "bg-rose-950/90 border-rose-500 text-rose-200 line-through";
                                                }
                                            }

                                            return `
                                                <button onclick="selectQuickCheck(${chNum}, ${qIdx}, ${optIdx})" class="w-full text-left p-2.5 rounded-xl border text-xs transition flex items-center justify-between ${btnClass}">
                                                    <span>${opt}</span>
                                                    ${selected !== null && optIdx === qc.correct ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : ''}
                                                    ${selected !== null && selected === optIdx && selected !== qc.correct ? '<i class="fa-solid fa-circle-xmark text-rose-400"></i>' : ''}
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>

                                    ${selected !== null ? `
                                        <div class="p-2.5 rounded-xl text-[11px] leading-relaxed ${isCorrect ? 'bg-emerald-950/40 border border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border border-rose-500/30 text-rose-300'}">
                                            <span class="font-bold flex items-center gap-1 mb-0.5">
                                                <i class="fa-solid ${isCorrect ? 'fa-check' : 'fa-info-circle'}"></i> ${isCorrect ? 'Correct!' : 'Explanation:'}
                                            </span>
                                            ${qc.explanation}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function selectQuickCheck(chapterNum, qIndex, optIndex) {
            if (!chapterCheckAnswers[chapterNum]) {
                chapterCheckAnswers[chapterNum] = [null, null];
            }
            chapterCheckAnswers[chapterNum][qIndex] = optIndex;
            renderPage();
        }

        function initKaTeX() {
            if (window.renderMathInElement) {
                try {
                    window.renderMathInElement(document.body, {
                        delimiters: [
                            {left: "$$", right: "$$", display: true},
                            {left: "$", right: "$", display: false}
                        ],
                        throwOnError: false
                    });
                } catch(e) {
                    console.log("KaTeX rendering note:", e);
                }
            }
        }

        function changePage(delta) {
            const targetIndex = currentPageIndex + delta;
            if (targetIndex >= 0 && targetIndex < pagesData.length) {
                currentPageIndex = targetIndex;
                renderPage();
            }
        }

        function goToPage(index) {
            if (index >= 0 && index < pagesData.length) {
                currentPageIndex = index;
                renderPage();
                const tocDrawer = document.getElementById("toc-drawer");
                if (!tocDrawer.classList.contains("translate-x-full")) {
                    toggleTOC();
                }
            }
        }

        function toggleTOC() {
            const tocDrawer = document.getElementById("toc-drawer");
            const backdrop = document.getElementById("toc-backdrop");
            const isOpen = !tocDrawer.classList.contains("translate-x-full");

            if (isOpen) {
                tocDrawer.classList.add("translate-x-full");
                backdrop.classList.add("hidden");
            } else {
                tocDrawer.classList.remove("translate-x-full");
                backdrop.classList.remove("hidden");
                populateTOCList();
            }
        }

        function populateTOCList() {
            const listContainer = document.getElementById("toc-list");
            listContainer.innerHTML = pagesData.map((p, idx) => `
                <button onclick="goToPage(${idx})" class="w-full text-left p-3 rounded-xl border transition flex items-center justify-between gap-3 ${idx === currentPageIndex ? 'bg-cyan-950/60 border-cyan-500/50 text-cyan-300' : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-800/60'}">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="w-6 h-6 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 ${p.color === 'rose' ? 'bg-rose-950 text-rose-300' : 'bg-cyan-950 text-cyan-300'}">${p.chapterNum}</span>
                        <div class="truncate">
                            <span class="block text-xs font-bold truncate">${p.title}</span>
                            <span class="block text-[10px] text-slate-400 truncate">${p.type}</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs opacity-40"></i>
                </button>
            `).join('');
        }

        function renderQuiz() {
            const container = document.getElementById("pisa-quiz-container");
            if (!container) return;

            container.innerHTML = pisaQuestions.map((q, qIndex) => {
                const selected = userAnswers[qIndex];
                const isCorrect = selected === q.correct;

                return `
                    <div class="p-4 sm:p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                        <div class="flex items-start justify-between gap-3">
                            <h4 class="font-display font-bold text-xs sm:text-sm text-slate-100 leading-snug">
                                <span class="text-cyan-400 font-mono mr-1">${q.id}.</span> ${q.question}
                            </h4>
                        </div>

                        <div class="grid grid-cols-1 gap-2 pt-1">
                            ${q.options.map((opt, oIndex) => {
                                let btnStyle = "bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800";
                                
                                if (selected === oIndex) {
                                    btnStyle = "bg-cyan-950/80 border-cyan-500 text-cyan-200 font-bold";
                                }

                                if (isSubmitted) {
                                    if (oIndex === q.correct) {
                                        btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold";
                                    } else if (selected === oIndex && selected !== q.correct) {
                                        btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200 line-through opacity-80";
                                    }
                                }

                                return `
                                    <button onclick="selectQuizOption(${qIndex}, ${oIndex})" ${isSubmitted ? 'disabled' : ''} class="w-full text-left p-3 rounded-xl border text-xs transition flex items-center justify-between ${btnStyle}">
                                        <span>${opt}</span>
                                        ${isSubmitted && oIndex === q.correct ? '<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>' : ''}
                                        ${isSubmitted && selected === oIndex && selected !== q.correct ? '<i class="fa-solid fa-circle-xmark text-rose-400 text-sm"></i>' : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${isSubmitted ? `
                            <div class="p-3 rounded-xl ${isCorrect ? 'bg-emerald-950/40 border border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border border-rose-500/30 text-rose-300'} text-xs space-y-1">
                                <span class="font-bold block flex items-center gap-1.5">
                                    <i class="fa-solid ${isCorrect ? 'fa-check' : 'fa-xmark'}"></i> ${isCorrect ? 'Correct Analysis!' : 'Incorrect'}
                                </span>
                                <p class="text-[11px] text-slate-300 leading-relaxed">${q.explanation}</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            updateScoreBadge();
        }

        function selectQuizOption(qIndex, oIndex) {
            if (isSubmitted) return;
            userAnswers[qIndex] = oIndex;
            renderQuiz();
            initKaTeX();
        }

        function submitPisaQuiz() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            if (answeredCount < pisaQuestions.length) {
                if (!confirm(`You have answered ${answeredCount} of ${pisaQuestions.length} questions. Do you want to submit anyway?`)) {
                    return;
                }
            }

            isSubmitted = true;
            renderQuiz();
            initKaTeX();

            const correctCount = userAnswers.filter((ans, idx) => ans === pisaQuestions[idx].correct).length;
            alert(`Assessment Complete!\nYour Score: ${correctCount} / ${pisaQuestions.length} (${Math.round((correctCount / pisaQuestions.length) * 100)}%)`);
        }

        function resetPisaQuiz() {
            userAnswers = new Array(pisaQuestions.length).fill(null);
            isSubmitted = false;
            renderQuiz();
            initKaTeX();
        }

        function updateScoreBadge() {
            const correctCount = userAnswers.filter((ans, idx) => ans === pisaQuestions[idx].correct).length;
            const badgeText = document.getElementById("quiz-score-text");
            if (badgeText) {
                badgeText.textContent = `${correctCount} / ${pisaQuestions.length}`;
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") changePage(-1);
            if (e.key === "ArrowRight") changePage(1);
        });

        window.onload = function() {
            renderPage();
        };
    </script>
</body>
</html>
