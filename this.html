                        <div class="p-4 bg-slate-950 border border-slate-800 rounded-2xl flex items-center justify-between gap-4">
                            <button onclick="resetPisaQuiz()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs transition flex items-center gap-2">
                                <i class="fa-solid fa-rotate-right"></i> Reset Answers
                            </button>
                            <button id="btn-submit-quiz" onclick="submitPisaQuiz()" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-white font-bold text-xs transition shadow-lg shadow-cyan-500/20 flex items-center gap-2">
                                <i class="fa-solid fa-check-double"></i> Submit & Check Score
                            </button>
                        </div>
                    </div>
                `
            }
        ];

        const mathQuizQuestions = [
            {
                id: 1,
                question: "In an oblique triangle, $b = 5$, $c = 8$, and angle $A = 60^\circ$. What is the length of side $a$ using the Law of Cosines?",
                options: ["A. 6", "B. 7", "C. 8", "D. 49"],
                correct: 1,
                explanation: "$a^2 = 5^2 + 8^2 - 2(5)(8)\cos(60^\circ) = 25 + 64 - 80(0.5) = 49 \rightarrow a = 7$."
            },
            {
                id: 2,
                question: "What is the solution to the quadratic inequality $x^2 - 5x + 6 \le 0$ in interval notation?",
                options: ["A. (2, 3)", "B. [2, 3]", "C. (-\infty, 2] \cup [3, \infty)", "D. (-2, -3)"],
                correct: 1,
                explanation: "Factoring yields boundary values $x = 2$ and $x = 3$. Non-strict inequality $\le$ includes endpoints, giving [2, 3]."
            },
            {
                id: 3,
                question: "For the inequality $y > 2x^2 + x - 3$, what boundary line and shading should be used on a graph?",
                options: [
                    "A. Solid curve, shaded below",
                    "B. Dashed curve, shaded above/inside the parabola",
                    "C. Solid curve, shaded above",
                    "D. Dashed curve, shaded outside"
                ],
                correct: 1,
                explanation: "Strict inequality '>' requires a dashed line. For $y >$ with $a > 0$, shade above/inside the upward parabola."
            },
            {
                id: 4,
                question: "What is the solution set for the absolute value equation $|2x - 3| = 7$?",
                options: ["A. {5, -2}", "B. {-5, 2}", "C. {5, 2}", "D. {-5, -2}"],
                correct: 0,
                explanation: "Solving $2x - 3 = 7 \rightarrow x = 5$ and $2x - 3 = -7 \rightarrow x = -2$. Solution set is {-2, 5}."
            },
            {
                id: 5,
                question: "What is the solution to $|x - 2| > 4$ expressed in interval notation?",
                options: ["A. (-2, 6)", "B. [-2, 6]", "C. (-\infty, -2) \cup (6, \infty)", "D. (-\infty, -2] \cup [6, \infty)"],
                correct: 2,
                explanation: "'Greater than' yields OR: $x - 2 < -4 \rightarrow x < -2$ OR $x - 2 > 4 \rightarrow x > 6$. Interval: $(-\infty, -2) \cup (6, \infty)$."
            },
            {
                id: 6,
                question: "Given the dataset 5, 8, 12, 15, 18, 20, 24, 27, 30, 35 ($n = 10$), what is the interpolated value of the first quartile ($Q_1$)?",
                options: ["A. 8", "B. 10", "C. 11", "D. 12"],
                correct: 2,
                explanation: "Position $= 1(11)/4 = 2.75$. Interpolation between 2nd value (8) and 3rd value (12): $[(12-8) \times 0.75] + 8 = 11$."
            },
            {
                id: 7,
                question: "What five values form the summary represented in a Box-and-Whisker Plot?",
                options: [
                    "A. Min, Q1, Median (Q2), Q3, Max",
                    "B. Min, Mean, Median, Mode, Max",
                    "C. D1, Q1, Q2, Q3, D9",
                    "D. Min, Lower Fence, Median, Upper Fence, Max"
                ],
                correct: 0,
                explanation: "A Box Plot summarizes the distribution using: Minimum, First Quartile ($Q_1$), Median ($Q_2$), Third Quartile ($Q_3$), and Maximum."
            },
            {
                id: 8,
                question: "For a dataset with $n = 15$ items, what is the calculated position for the 70th percentile ($P_{70}$)?",
                options: ["A. 10.5", "B. 11.2", "C. 12.0", "D. 11.5"],
                correct: 1,
                explanation: "Position $P_{70} = \frac{70(15+1)}{100} = \frac{70(16)}{100} = 11.2$."
            },
            {
                id: 9,
                question: "If a student scores at the 90th percentile on a national entrance exam, what does this indicate?",
                options: [
                    "A. The student answered 90% of exam questions correctly.",
                    "B. The student performed at or better than 90% of exam takers.",
                    "C. The student failed 10% of the exam.",
                    "D. The student ranked 90th in total score."
                ],
                correct: 1,
                explanation: "Percentile rank indicates relative standing: scoring at the 90th percentile means outperforming or matching 90% of takers."
            },
            {
                id: 10,
                question: "Which mathematical concept is used in quality control to check acceptable dimension variations (e.g., $10\text{ cm} \pm 0.05\text{ cm}$)?",
                options: ["A. Law of Cosines", "B. Absolute Value Equations", "C. Percentile Rank", "D. Quadratic Inequalities"],
                correct: 1,
                explanation: "Absolute value equations model tolerance limits where distance from a target measurement cannot exceed a specific error threshold."
            }
        ];

        let currentPageIndex = 0;
        let userAnswers = new Array(mathQuizQuestions.length).fill(null);
        let chapterCheckAnswers = {};
        let isSubmitted = false;

        function renderPage() {
            const page = pagesData[currentPageIndex];
            const contentDiv = document.getElementById("page-content");

            let badgeColorClass = "bg-cyan-500/20 text-cyan-300 border-cyan-500/30";
            
            let quickChecksHtml = "";
            if (page.quickChecks && page.quickChecks.length > 0) {
                quickChecksHtml = buildQuickChecksHtml(page);
            }

            contentDiv.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border ${badgeColorClass}">
                                ${page.badge}
                            </span>
                            <span class="text-xs text-slate-400 font-mono">Module ${page.chapterNum} of ${pagesData.length}</span>
                        </div>
                        <h2 class="font-display font-bold text-2xl text-slate-100">${page.title}</h2>
                        <p class="text-xs text-slate-400 mt-0.5">${page.subtitle}</p>
                    </div>
                </div>
                ${page.html}
                ${quickChecksHtml}
            `;

            const progressPercent = ((currentPageIndex + 1) / pagesData.length) * 100;
            document.getElementById("reading-progress-bar").style.width = `${progressPercent}%`;
            document.getElementById("page-counter-badge").textContent = `Page ${currentPageIndex + 1} / ${pagesData.length}`;

            document.getElementById("btn-prev").disabled = currentPageIndex === 0;
            
            const btnNext = document.getElementById("btn-next");
            if (currentPageIndex === pagesData.length - 1) {
                btnNext.innerHTML = `Finish Reviewer <i class="fa-solid fa-check ml-1"></i>`;
                btnNext.onclick = () => goToPage(0);
            } else {
                btnNext.innerHTML = `Next Module <i class="fa-solid fa-chevron-right ml-1"></i>`;
                btnNext.onclick = () => changePage(1);
            }

            const dotsContainer = document.getElementById("page-dots-container");
            dotsContainer.innerHTML = pagesData.map((_, idx) => `
                <button onclick="goToPage(${idx})" class="w-2.5 h-2.5 rounded-full transition-all shrink-0 ${idx === currentPageIndex ? 'bg-cyan-400 w-6' : 'bg-slate-700 hover:bg-slate-500'}"></button>
            `).join('');

            if (page.chapterNum === 12) {
                renderQuiz();
            }

            initKaTeX();
            document.getElementById("book-page-wrapper").scrollTop = 0;
        }

        function buildQuickChecksHtml(page) {
            const chNum = page.chapterNum;
            const savedState = chapterCheckAnswers[chNum] || [null, null];

            return `
                <div class="mt-8 pt-6 border-t border-slate-800 space-y-4">
                    <div class="flex items-center gap-2 text-amber-400 font-display font-bold text-sm">
                        <div class="w-7 h-7 rounded-lg bg-amber-500/20 flex items-center justify-center border border-amber-500/30">
                            <i class="fa-solid fa-lightbulb text-xs"></i>
                        </div>
                        <span>Module Practice Check (${page.quickChecks.length} Questions)</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${page.quickChecks.map((qc, qIdx) => {
                            const selected = savedState[qIdx];
                            const isCorrect = selected === qc.correct;

                            return `
                                <div class="bg-slate-950/80 border border-slate-800 rounded-2xl p-4 space-y-3 flex flex-col justify-between">
                                    <div class="space-y-2">
                                        <span class="text-[10px] font-bold font-mono text-cyan-400 uppercase tracking-wider block">Check ${qIdx + 1}</span>
                                        <h5 class="text-xs font-semibold text-slate-100 leading-snug">${qc.question}</h5>
                                    </div>

                                    <div class="space-y-2 pt-1">
                                        ${qc.options.map((opt, optIdx) => {
                                            let btnClass = "bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800";
                                            if (selected !== null) {
                                                if (optIdx === qc.correct) {
                                                    btnClass = "bg-emerald-950/90 border-emerald-500 text-emerald-200 font-bold";
                                                } else if (selected === optIdx) {
                                                    btnClass = "bg-rose-950/90 border-rose-500 text-rose-200 line-through";
                                                }
                                            }

                                            return `
                                                <button onclick="selectQuickCheck(${chNum}, ${qIdx}, ${optIdx})" class="w-full text-left p-2.5 rounded-xl border text-xs transition flex items-center justify-between ${btnClass}">
                                                    <span>${opt}</span>
                                                    ${selected !== null && optIdx === qc.correct ? '<i class="fa-solid fa-circle-check text-emerald-400"></i>' : ''}
                                                    ${selected !== null && selected === optIdx && selected !== qc.correct ? '<i class="fa-solid fa-circle-xmark text-rose-400"></i>' : ''}
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>

                                    ${selected !== null ? `
                                        <div class="p-2.5 rounded-xl text-[11px] leading-relaxed ${isCorrect ? 'bg-emerald-950/40 border border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border border-rose-500/30 text-rose-300'}">
                                            <span class="font-bold flex items-center gap-1 mb-0.5">
                                                <i class="fa-solid ${isCorrect ? 'fa-check' : 'fa-info-circle'}"></i> ${isCorrect ? 'Correct!' : 'Explanation:'}
                                            </span>
                                            ${qc.explanation}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function selectQuickCheck(chapterNum, qIndex, optIndex) {
            if (!chapterCheckAnswers[chapterNum]) {
                chapterCheckAnswers[chapterNum] = [null, null];
            }
            chapterCheckAnswers[chapterNum][qIndex] = optIndex;
            renderPage();
        }

        function initKaTeX() {
            if (window.renderMathInElement) {
                try {
                    window.renderMathInElement(document.body, {
                        delimiters: [
                            {left: "$$", right: "$$", display: true},
                            {left: "$", right: "$", display: false}
                        ],
                        throwOnError: false
                    });
                } catch(e) {
                    console.log("KaTeX note:", e);
                }
            }
        }

        function changePage(delta) {
            const targetIndex = currentPageIndex + delta;
            if (targetIndex >= 0 && targetIndex < pagesData.length) {
                currentPageIndex = targetIndex;
                renderPage();
            }
        }

        function goToPage(index) {
            if (index >= 0 && index < pagesData.length) {
                currentPageIndex = index;
                renderPage();
                const tocDrawer = document.getElementById("toc-drawer");
                if (!tocDrawer.classList.contains("translate-x-full")) {
                    toggleTOC();
                }
            }
        }

        function toggleTOC() {
            const tocDrawer = document.getElementById("toc-drawer");
            const backdrop = document.getElementById("toc-backdrop");
            const isOpen = !tocDrawer.classList.contains("translate-x-full");

            if (isOpen) {
                tocDrawer.classList.add("translate-x-full");
                backdrop.classList.add("hidden");
            } else {
                tocDrawer.classList.remove("translate-x-full");
                backdrop.classList.remove("hidden");
                populateTOCList();
            }
        }

        function populateTOCList() {
            const listContainer = document.getElementById("toc-list");
            listContainer.innerHTML = pagesData.map((p, idx) => `
                <button onclick="goToPage(${idx})" class="w-full text-left p-3 rounded-xl border transition flex items-center justify-between gap-3 ${idx === currentPageIndex ? 'bg-cyan-950/60 border-cyan-500/50 text-cyan-300' : 'bg-slate-950/60 border-slate-800 text-slate-300 hover:bg-slate-800/60'}">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <span class="w-6 h-6 rounded-lg font-bold text-xs flex items-center justify-center shrink-0 bg-cyan-950 text-cyan-300">${p.chapterNum}</span>
                        <div class="truncate">
                            <span class="block text-xs font-bold truncate">${p.title}</span>
                            <span class="block text-[10px] text-slate-400 truncate">${p.type}</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs opacity-40"></i>
                </button>
            `).join('');
        }

        function renderQuiz() {
            const container = document.getElementById("pisa-quiz-container");
            if (!container) return;

            container.innerHTML = mathQuizQuestions.map((q, qIndex) => {
                const selected = userAnswers[qIndex];
                const isCorrect = selected === q.correct;

                return `
                    <div class="p-4 sm:p-5 rounded-2xl bg-slate-950 border border-slate-800 space-y-3">
                        <div class="flex items-start justify-between gap-3">
                            <h4 class="font-display font-bold text-xs sm:text-sm text-slate-100 leading-snug">
                                <span class="text-cyan-400 font-mono mr-1">${q.id}.</span> ${q.question}
                            </h4>
                        </div>

                        <div class="grid grid-cols-1 gap-2 pt-1">
                            ${q.options.map((opt, oIndex) => {
                                let btnStyle = "bg-slate-900 border-slate-800 text-slate-300 hover:bg-slate-800";
                                
                                if (selected === oIndex) {
                                    btnStyle = "bg-cyan-950/80 border-cyan-500 text-cyan-200 font-bold";
                                }

                                if (isSubmitted) {
                                    if (oIndex === q.correct) {
                                        btnStyle = "bg-emerald-950/80 border-emerald-500 text-emerald-200 font-bold";
                                    } else if (selected === oIndex && selected !== q.correct) {
                                        btnStyle = "bg-rose-950/80 border-rose-500 text-rose-200 line-through opacity-80";
                                    }
                                }

                                return `
                                    <button onclick="selectQuizOption(${qIndex}, ${oIndex})" ${isSubmitted ? 'disabled' : ''} class="w-full text-left p-3 rounded-xl border text-xs transition flex items-center justify-between ${btnStyle}">
                                        <span>${opt}</span>
                                        ${isSubmitted && oIndex === q.correct ? '<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>' : ''}
                                        ${isSubmitted && selected === oIndex && selected !== q.correct ? '<i class="fa-solid fa-circle-xmark text-rose-400 text-sm"></i>' : ''}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${isSubmitted ? `
                            <div class="p-3 rounded-xl ${isCorrect ? 'bg-emerald-950/40 border border-emerald-500/30 text-emerald-300' : 'bg-rose-950/40 border border-rose-500/30 text-rose-300'} text-xs space-y-1">
                                <span class="font-bold block flex items-center gap-1.5">
                                    <i class="fa-solid ${isCorrect ? 'fa-check' : 'fa-xmark'}"></i> ${isCorrect ? 'Correct Answer!' : 'Incorrect'}
                                </span>
                                <p class="text-[11px] text-slate-300 leading-relaxed">${q.explanation}</p>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            updateScoreBadge();
        }

        function selectQuizOption(qIndex, oIndex) {
            if (isSubmitted) return;
            userAnswers[qIndex] = oIndex;
            renderQuiz();
            initKaTeX();
        }

        function submitPisaQuiz() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            if (answeredCount < mathQuizQuestions.length) {
                if (!confirm(`You have answered ${answeredCount} of ${mathQuizQuestions.length} questions. Submit anyway?`)) {
                    return;
                }
            }

            isSubmitted = true;
            renderQuiz();
            initKaTeX();

            const correctCount = userAnswers.filter((ans, idx) => ans === mathQuizQuestions[idx].correct).length;
            alert(`Assessment Complete!\nYour Score: ${correctCount} / ${mathQuizQuestions.length} (${Math.round((correctCount / mathQuizQuestions.length) * 100)}%)`);
        }

        function resetPisaQuiz() {
            userAnswers = new Array(mathQuizQuestions.length).fill(null);
            isSubmitted = false;
            renderQuiz();
            initKaTeX();
        }

        function updateScoreBadge() {
            const correctCount = userAnswers.filter((ans, idx) => ans === mathQuizQuestions[idx].correct).length;
            const badgeText = document.getElementById("quiz-score-text");
            if (badgeText) {
                badgeText.textContent = `${correctCount} / ${mathQuizQuestions.length}`;
            }
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") changePage(-1);
            if (e.key === "ArrowRight") changePage(1);
        });

        window.onload = function() {
            renderPage();
        };
    </script>
</body>
</html>
